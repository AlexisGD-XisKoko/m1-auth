services:
  m1-auth:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: m1-auth-stub
    ports:
      - "8000:8000"
    environment:
      ENV: development
      ENABLE_DEV_STUB: "true"
      JWT_ISSUER: https://auth.boletera.local
      JWT_AUDIENCE: boletera-api
      ACCESS_TOKEN_TTL_SECONDS: "900"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 3s
      retries: 3
