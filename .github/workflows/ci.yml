# AG-02: pipeline de CI en cada Pull Request y en main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: boletera
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/boletera
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Gitleaks necesita el historial completo

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint y formato)
        run: |
          ruff check .
          ruff format --check .

      - name: mypy
        run: mypy app

      # Cuando exista 00_init.sql (OG-01), cárgalo aquí antes de las pruebas:
      # - name: Crear esquemas y roles
      #   run: psql postgresql://postgres:postgres@localhost:5432/boletera -f db/00_init.sql

      - name: pytest
        run: pytest --cov=app --cov-report=term-missing

      - name: Bandit
        run: bandit -c pyproject.toml -r app

      - name: pip-audit
        run: pip-audit -r requirements.txt

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    runs-on: ubuntu-latest
    needs: quality-and-tests
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen (sin publicar; la publicación a GHCR es AG-09)
        run: docker build -t m1-auth:ci .
