# AG-02: pipeline de CI en cada Pull Request y en main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: boletera
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      PGPASSWORD: postgres
      # Credenciales efímeras SOLO para la BD del job (no son secretos reales).
      M1_OWNER_URL: postgresql+psycopg://m1_owner:ci-owner@localhost:5432/boletera
      TEST_DATABASE_URL: postgresql+psycopg://m1_app:ci-app@localhost:5432/boletera
      TEST_OTHER_MODULE_URL: postgresql+psycopg://m2_app:ci-other@localhost:5432/boletera

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Gitleaks necesita el historial completo

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint y formato)
        run: |
          ruff check .
          ruff format --check .

      - name: mypy (strict)
        run: |
          mypy app
          mypy --strict middleware/python scripts

      - name: Crear esquemas, roles y permisos (00_init.sql · OG-01)
        run: >
          psql -h localhost -U postgres -d boletera
          -v m1_owner_pw=ci-owner -v m1_app_pw=ci-app -v other_pw=ci-other
          -f db/sql/00_init.sql

      - name: Migraciones del esquema auth como m1_owner (AG-06)
        run: MIGRATIONS_DATABASE_URL=$M1_OWNER_URL alembic upgrade head

      - name: pytest contra PostgreSQL real (incluye pruebas de permisos AG-03)
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: pytest con SQLite (sin infraestructura)
        run: TEST_DATABASE_URL= TEST_OTHER_MODULE_URL= pytest -q

      - name: El contrato openapi.yaml está actualizado (BT-01)
        run: |
          python scripts/export_openapi.py
          git diff --exit-code openapi.yaml

      - name: Bandit
        run: bandit -c pyproject.toml -r app

      - name: pip-audit
        run: pip-audit -r requirements.txt

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  docker-build:
    runs-on: ubuntu-latest
    needs: quality-and-tests
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen (la publicación a GHCR es AG-09)
        run: docker build -t m1-auth:ci .
